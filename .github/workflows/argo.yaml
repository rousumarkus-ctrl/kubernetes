name: Deploy staging

on:
  push:
    branches:
      - '**'
    tags:
      - '!**'

env:
  USER: mrousu

jobs:
  todo-backend:
    name: Build, Push todo-backend
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-image.outputs.IMAGE_BACKEND }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Form the image name
        id: set-image
        run: |
          echo "IMAGE_BACKEND=$USER/todo-backend:$GITHUB_SHA" >> $GITHUB_ENV
          echo "IMAGE_BACKEND=$USER/todo-backend:$GITHUB_SHA" >> $GITHUB_OUTPUT

      - name: Build and publish backend
        working-directory: ./the-project/todo-backend
        run: |-
          docker build --tag "$IMAGE_BACKEND" .
          docker push "$IMAGE_BACKEND"

  todo-app:
    name: Build, Push todo-app
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-image.outputs.IMAGE_APP }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Form the image name
        id: set-image
        run: |
          echo "IMAGE_APP=$USER/todo-app:$GITHUB_SHA" >> $GITHUB_ENV
          echo "IMAGE_APP=$USER/todo-app:$GITHUB_SHA" >> $GITHUB_OUTPUT

      - name: Build and publish backend
        working-directory: ./the-project/todo-app
        run: |-
          docker build --tag "$IMAGE_APP" .
          docker push "$IMAGE_APP"

  set-kustomization:
    name: Update kustom
    needs: [todo-backend, todo-app]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.KUBERNETES_CONFIG_TOKEN }}
          repository: rousumarkus-ctrl/kubernetes-config
          path: kubernetes-config

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Use todo-app image
        working-directory: ./kubernetes-config/the-project/todo-app/overlays/staging
        run: |
          kustomize edit set image PROJECT/TODOAPP=${{ needs.todo-app.outputs.image }}

      - name: Use todo-backend image
        working-directory: ./kubernetes-config/the-project/todo-backend/overlays/staging
        run: |
          kustomize edit set image PROJECT/TODOBACKEND=${{ needs.todo-backend.outputs.image }}

      - name: commit
        working-directory: ./kubernetes-config
        env:
          GITHUB_TOKEN: ${{ secrets.KUBERNETES_CONFIG_TOKEN}}
        run: |
          git config user.name 'rousumarkus-ctrl'
          git config user.email 'rousu.markus@gmail.com'
          git add 'the-project/todo-app/overlays/staging/kustomization.yaml'
          git add 'the-project/todo-backend/overlays/staging/kustomization.yaml'
          git commit -m 'Update configs ${{ github.sha}}'
          git push
