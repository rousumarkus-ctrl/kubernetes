on:
  push:
    branches:
      - '**'
    tags:
      - '!**'

env:
  USER: mrousu
  IMAGE: logoutput
  FOLDER: ./log/logoutput
  IMAGE_HOLDER: LOG/OUTPUT

jobs:
  build-publish:
    name: Build, Push, Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FOLDER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Form the image name
        run: echo "IMAGE_TAG=$USER/$IMAGE:$GITHUB_SHA" >> $GITHUB_ENV

      - name: Build and publish backend
        run: |-
          docker build --tag "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Use right image
        working-directory: ./log
        run: kustomize edit set image $IMAGE_HOLDER=$IMAGE_TAG

      - name: commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v9
        with:
          add: 'kustomization.yaml'
          message: New version released ${{ github.sha }}
