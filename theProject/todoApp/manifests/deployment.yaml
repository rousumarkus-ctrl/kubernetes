apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: shared-image
          persistentVolumeClaim:
            claimName: pong-claim
      containers:
        - name: todo-app
          image: mrousu/todoapp:fc8ea032220ab2e7a59062a50bc0e721adc5772c
          volumeMounts:
            - name: shared-image
              mountPath: /usr/src/app/images
