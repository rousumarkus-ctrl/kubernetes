apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: shared-image
          persistentVolumeClaim:
            claimName: pong-claim
      containers:
        - name: todo-app
          image: mrousu/todoapp:e3359e24650747703d099cbe9800ca44319da3fb
          volumeMounts:
            - name: shared-image
              mountPath: /usr/src/app/images
