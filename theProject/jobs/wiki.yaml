apiVersion: batch/v1
kind: Job
metadata:
  name: wiki
  namespace: project
spec:
  template:
    spec:
      containers:
        - name: wiki
          image: mrousu/todo-wiki:40fef67f63cc72a68e270d4b6baef49c3cdb6582
          env:
            - name: WIKI_URL
              value: https://en.wikipedia.org/wiki/Special:Random
            - name: TODO_URL
              value: http://todo-backend-svc/todos
      restartPolicy: Never # This time we'll run it only once
