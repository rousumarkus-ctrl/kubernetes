apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: shared-image
          persistentVolumeClaim:
            claimName: image-claim
      containers:
        - name: todo-app
          image: mrousu/todoapp:7793a73c9a121044643717b44fd6272e888d5473
          envFrom:
            - configMapRef:
                name: todo-configmap
          volumeMounts:
            - name: shared-image
              mountPath: /usr/src/app/images
