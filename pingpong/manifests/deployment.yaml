apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      volumes:
        - name: shared-pong
          persistentVolumeClaim:
            claimName: pong-claim
      containers:
        - name: pingpong
          image: mrousu/pingpong:fc9198f08deec2b67f5ec5fbe47ae3597c0b00c4
          volumeMounts:
            - name: shared-pong
              mountPath: /usr/src/app/pongfiles
