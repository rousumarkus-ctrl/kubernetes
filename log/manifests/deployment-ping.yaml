apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: pingpong-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  strategy:
    canary:
      steps:
        - setWeight: 100
        - analysis:
            templates:
              - templateName: pingpong-cpu-analysis
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      #volumes:
      #  - name: shared-pong
      #    persistentVolumeClaim:
      #      claimName: pong-claim
      containers:
        - name: pingpong
          image: LOG/PINGPONG
          readinessProbe:
            initialDelaySeconds: 10 # Initial delay until the readiness is tested
            periodSeconds: 5 # How often to test
            httpGet:
              path: /healthz
              port: 3000
          env:
            - name: PONG_PORT
              value: '3000'
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGHOST
              value: postgres-svc
          #volumeMounts:
          #  - name: shared-pong
          #    mountPath: /usr/src/app/pongfiles
