apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      #volumes:
      #  - name: shared-pong
      #    persistentVolumeClaim:
      #      claimName: pong-claim
      containers:
        - name: pingpong
          image: mrousu/pingpong:b7b0e8157c39b3e2357c19ba69282db2941349a2
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGHOST
              value: postgres-svc
          #volumeMounts:
          #  - name: shared-pong
          #    mountPath: /usr/src/app/pongfiles
