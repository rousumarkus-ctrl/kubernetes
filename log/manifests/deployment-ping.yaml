apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      #volumes:
      #  - name: shared-pong
      #    persistentVolumeClaim:
      #      claimName: pong-claim
      containers:
        - name: pingpong
          image: LOG/PINGPONG
          env:
            - name: PONG_PORT
              value: '3000'
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGHOST
              value: postgres-svc
          #volumeMounts:
          #  - name: shared-pong
          #    mountPath: /usr/src/app/pongfiles
