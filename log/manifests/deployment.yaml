apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log
  template:
    metadata:
      labels:
        app: log
    spec:
      volumes:
        - name: shared-log
          emptyDir: {}
        - name: shared-pong
          persistentVolumeClaim:
            claimName: pong-claim
      containers:
        - name: logoutput
          image: mrousu/logoutput:fc9198f08deec2b67f5ec5fbe47ae3597c0b00c4
          volumeMounts:
            - name: shared-log
              mountPath: /usr/src/app/files
            - name: shared-pong
              mountPath: /usr/src/app/pongfiles
        - name: logsaver
          image: mrousu/logsaver:5c6df27e5bbe8519d318e12eace65e0498d56021
          volumeMounts:
            - name: shared-log
              mountPath: /usr/src/app/files
