apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: pingpong-cpu-analysis
  namespace: exercises
spec:
  metrics:
    - name: pingpong-cpu
      initialDelay: 5m
      successCondition: result < 0.4
      provider:
        prometheus:
          address: http://kube-prometheus-stack-1766-prometheus.prometheus.svc.cluster.local:9090
          query: |
            scalar(sum(rate(container_cpu_usage_seconds_total{namespace='exercises'}[5m])))
